    quotes:
    - 'geneEncodingType: Plasmid'
- accession: P49264
  alternative: A0AAU9RUE5
  assessment: EQUIVALENT
  reason: The reference sequence is exactly identical across all 496 residues. Other P450 hits are substantially
    less similar. This supports equivalent protein representation without relying on the broad automatic
    cytochrome-P450 name to establish substrate specificity.
- accession: P49278
  alternative: A0ABQ8J715
  assessment: EQUIVALENT
  reason: The 146-residue reference sequence differs at three residues with full ungapped coverage (97.95%
    identity), and is strongly separated from other lipid-transfer-family matches. This supports a qualified
    sequence-based Der p 2 counterpart; its generic transfer-protein label does not independently establish
    allergenicity or identical immunological properties.
- accession: Q00363
  alternative: L7YE01
  assessment: EQUIVALENT
  reason: The reference Avr4 sequence is exactly identical across all 135 residues and is the only significant
    hit. This supports equivalent protein representation while retaining the reviewed accession and its
    source-race-specific evidence.
- accession: Q04720
  alternative: null
  assessment: NONE
  reason: Both exact-taxon reference proteomes were searched. The only hit is RsmA Q81W00 at 27.30% global
    identity, a distinct ribosomal methyltransferase. Related methyltransferase ancestry does not establish
    an ErmJ resistance counterpart; no supported alternative was identified.
- accession: Q07341
  alternative: A0A1D7XAJ1
  assessment: EQUIVALENT
  reason: The reference corrinoid/iron-sulfur small-subunit sequence is exactly identical across all 323
    residues. The changed organism code in the target entry name is not used as taxonomy evidence; live
    record/proteome taxon identifiers are checked. Retain the Swiss-Prot accession.
- accession: Q54FI4
  alternative: null
  assessment: NONE
  reason: No significant reference-proteome hit was returned for the AX4 chlA sequence. Because the source
    and reference context are closely related, this is a notable gene-model or proteome-coverage question
    for UniProt. The negative protein search does not establish genomic absence; investigate its source
    genomic locus before drawing that conclusion.
- accession: Q6RHR6
  alternative: G7IN96
  assessment: EQUIVALENT
  reason: The reference sequence is exactly identical across all 882 residues and is separated from CASTOR-like
    paralogs. Primary-record genomic cross-references provide additional mapping context. This supports
    equivalent DMI1 protein representation; the broad pollux-like target label is not a separate functional
    assertion.
- accession: Q8L4H4
  alternative: A9YWR7
  assessment: EQUIVALENT
  reason: The reference sequence is exactly identical across all 925 residues. G7KGF4 is an additional
    shorter model with 902 identical residues, but A9YWR7 represents the complete primary sequence. The
    kinase-family search reached its 1000-hit cap; this does not weaken the observed full-length identity
    but prevents claiming exhaustive paralog retrieval.
- accession: Q93XQ5
  alternative: A0A314LG79
  assessment: CANDIDATE
  reason: The leading sequence differs by one residue across 388 residues, but the reference entry is
    reviewed PMT3 whereas the primary is PMT1. Near identity is insufficient to collapse duplicated PMT
    loci or resolve nomenclature. Retain a candidate pending genomic placement and reconciliation of PMT1/PMT3
    naming.
  additional_evidence:
  - type: CURATION_CONTEXT
    description: The two reviewed entries are named PMT1 and PMT3; gene nomenclature and possible duplication
      remain unresolved despite near-identical sequence.
    quotes:
    - 'value: PMT1'
    - 'value: PMT3'
- accession: Q945B5
  alternative: Q9ZTA2
  assessment: LOCUS_COUNTERPART
  reason: UniProt explicitly identifies Q9ZTA2 as the Columbia AOP2 allele with a 5-bp deletion leading
    to a non-functional protein, contrasting the functional Cvi allele Q945B5. The observed sequence differences
    and length loss are consistent with that curated distinction. Record same-locus correspondence, not
    equivalent catalytic function.
  additional_evidence:
  - type: CURATION_CONTEXT
    description: UniProt directly identifies the Columbia AOP2 deletion allele and the functional Cvi
      counterpart.
    quotes:
    - 5-bp deletion that leads to a non-functional protein
    - functional and expressed alleles for AOP2 (AC Q945B5)
- accession: Q9GF35
  alternative: A0A1U9RZH7
  assessment: EQUIVALENT
  reason: The leading full-length chloroplast maturase-K sequence has 98.21% global identity, eight substitutions
    and one gap column. Other hits are much shorter maturase fragments. This supports a qualified sequence-based
    counterpart while preserving the source sequence and documenting the differences.
